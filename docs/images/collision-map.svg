<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img"><title>From a physics question to a result</title><rect width="1200" height="240" fill="#101e35"/><text x="40" y="48" fill="white" font-family="sans-serif" font-size="26">From a physics question to a result</text><rect x="25" y="88" width="210" height="82" rx="12" fill="#193955" stroke="#58d9cb"/><text x="130" y="119" text-anchor="middle" fill="white" font-family="sans-serif" font-size="15">Choose beams</text><text x="130" y="143" text-anchor="middle" fill="white" font-family="sans-serif" font-size="15">+ process</text><path d="M239 128 h18 l-5 -5 m5 5 l-5 5" fill="none" stroke="#58d9cb" stroke-width="2"/><rect x="262" y="88" width="210" height="82" rx="12" fill="#193955" stroke="#58d9cb"/><text x="367" y="119" text-anchor="middle" fill="white" font-family="sans-serif" font-size="15">PYTHIA: generate</text><text x="367" y="143" text-anchor="middle" fill="white" font-family="sans-serif" font-size="15">particles</text><path d="M476 128 h18 l-5 -5 m5 5 l-5 5" fill="none" stroke="#58d9cb" stroke-width="2"/><rect x="499" y="88" width="210" height="82" rx="12" fill="#193955" stroke="#58d9cb"/><text x="604" y="119" text-anchor="middle" fill="white" font-family="sans-serif" font-size="15">FastJet: reconstruct</text><text x="604" y="143" text-anchor="middle" fill="white" font-family="sans-serif" font-size="15">jets</text><path d="M713 128 h18 l-5 -5 m5 5 l-5 5" fill="none" stroke="#58d9cb" stroke-width="2"/><rect x="736" y="88" width="210" height="82" rx="12" fill="#193955" stroke="#58d9cb"/><text x="841" y="119" text-anchor="middle" fill="white" font-family="sans-serif" font-size="15">Many events:</text><text x="841" y="143" text-anchor="middle" fill="white" font-family="sans-serif" font-size="15">histograms</text><path d="M950 128 h18 l-5 -5 m5 5 l-5 5" fill="none" stroke="#58d9cb" stroke-width="2"/><rect x="973" y="88" width="210" height="82" rx="12" fill="#193955" stroke="#58d9cb"/><text x="1078" y="119" text-anchor="middle" fill="white" font-family="sans-serif" font-size="15">Check definitions</text><text x="1078" y="143" text-anchor="middle" fill="white" font-family="sans-serif" font-size="15">+ errors</text><text x="40" y="213" fill="#adc4db" font-family="sans-serif" font-size="15">Conceptual learning map — not a detector display or a simulation result.</text></svg>